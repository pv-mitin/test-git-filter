name: Security Merge Checks

on:
  pull_request:
    branches:
      - main

jobs:
  verifyCommits:
    name: Verify PR commits are signed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check PR commits for verification
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 200
            });
            const unverified = commits.filter(c => !(c.commit && c.commit.verification && c.commit.verification.verified === true));
            if (unverified.length > 0) throw new Error(`Found ${unverified.length} unverified commit(s) in this PR.`);
